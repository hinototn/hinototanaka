<section class="intro"><h1>地図に映らないもの</h1><p>ミドルベリー大学で地理学を学びながら、地図づくりやGISを使った調査に取り組んでいる。沖縄の米軍基地、コペンハーゲンの共同生活、リッチモンドの投票所への行きやすさなどを地図にしてきた。</p><p>地図で何を見せ、何を省くか。そんな選択に興味がある。連絡は <a href="https://www.linkedin.com/in/hinoto-tanaka/" rel="noopener noreferrer" target="_blank">LinkedIn</a> か <a href="mailto:htanaka@middlebury.edu">メール</a> から。</p></section>
