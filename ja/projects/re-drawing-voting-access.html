<h1>投票所への行きやすさを見直す</h1>
<p class="project-intro">投票所の場所を変えたら、リッチモンドの人たちは投票しやすくなるのか。</p>
<div class="project-hero"><figure class="map-main">
<a aria-label="画像を大きく開く：リッチモンドの各地区で、投票所まで1マイル以上ある住宅の割合がどう変わるかを示した地図" href="../../images/projects/richmond-change.webp" rel="noopener noreferrer" target="_blank"><img alt="リッチモンドの各地区で、投票所まで1マイル以上ある住宅の割合がどう変わるかを示した地図" height="1448" loading="lazy" src="../../images/projects/richmond-change.webp" width="2048"/></a>
<figcaption>投票所までの距離の変化</figcaption>
</figure></div>
<div class="project-writing"><p>QGISを使い、投票所まで1マイル以上ある住宅の割合を地区ごとに調べた。車を持たない世帯も重ね、徒歩での距離に注目した。</p><p>投票所の位置を変えて比べると、40地区で行きやすくなり、15地区では逆に遠くなった。1マイル以上離れた住宅の平均割合は22.9%から21.2%に減った。場所を変えることは役立つが、どこでも同じ結果になるわけではない。</p></div>
