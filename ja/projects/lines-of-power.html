<h1>選挙区の線が変えるもの</h1>
<p class="project-intro">同じ票でも、選挙区の線が変われば地図の見え方が変わる。</p>
<div class="project-hero"><figure class="map-main">
<a aria-label="画像を大きく開く：カリフォルニアの2021年とAB 604案の選挙区で共和党の得票率を比べた地図" href="../../images/projects/california-compare.webp" rel="noopener noreferrer" target="_blank"><img alt="カリフォルニアの2021年とAB 604案の選挙区で共和党の得票率を比べた地図" height="1074" loading="lazy" src="../../images/projects/california-compare.webp" width="2048"/></a>
<figcaption>選挙区の比較図</figcaption>
</figure></div>
<div class="project-writing"><p>カリフォルニア州の2021年の下院選挙区と、AB 604案の区割りを比べ、トランプへの得票率を地図にした。指標は同じでも、区切る範囲が違う。</p><p>表には、数字が大きく変わる選挙区をまとめた。区割りの違いを比べたもので、次の選挙結果を予測するものではない。</p></div>
