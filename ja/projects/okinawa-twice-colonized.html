<h1>沖縄・支配下に置かれている島</h1>
<p class="project-intro">沖縄の広い土地を米軍基地が占めている。その周りで何が起きているのかを地図にした。</p>
<div class="project-hero"><div aria-label="地図に使う言語" class="map-language-options" role="group">
<button aria-pressed="true" data-map-language="en" type="button">English</button>
<button aria-pressed="false" data-map-language="ja" lang="ja" type="button">日本語</button>
</div>
<div class="map-figure" data-map="en">
<figure class="map-main">
<a aria-label="画像を大きく開く：沖縄の米軍基地をえんじ色で示し、土地利用とサンゴ礁を重ねた地図" href="../../images/projects/okinawa-english.webp" rel="noopener noreferrer" target="_blank"><img alt="沖縄の米軍基地をえんじ色で示し、土地利用とサンゴ礁を重ねた地図" height="1296" loading="lazy" src="../../images/projects/okinawa-english.webp" width="1782"/></a>
<figcaption>英語版</figcaption>
</figure>
</div>
<div class="map-figure" data-map="ja">
<figure class="map-main">
<a aria-label="画像を大きく開く：沖縄の米軍基地、土地利用、サンゴ礁を示す日本語の地図" href="../../images/projects/okinawa-japanese.webp" rel="noopener noreferrer" target="_blank"><img alt="沖縄の米軍基地、土地利用、サンゴ礁を示す日本語の地図" height="1296" loading="lazy" src="../../images/projects/okinawa-japanese.webp" width="1782"/></a>
<figcaption>日本語版</figcaption>
</figure>
</div>
</div>
<div class="project-writing"><p>基地の場所に、森、農地、市街地、サンゴ礁を重ねた。北部訓練場、辺野古湾、嘉手納、普天間の四つの場所から、軍の存在が土地や暮らしに与える影響を見た。</p><p>空間データの整理にはQGIS、仕上げにはIllustratorを使った。英語版と日本語版を作り、NACIS 2025で発表した。</p></div>
