<h1>新しい住宅をどこに建てるか</h1>
<p class="project-intro">バーモント州アディソン郡で、住宅を増やせそうな場所を探した。</p>
<div class="project-hero"><figure class="map-main">
<a aria-label="画像を大きく開く：アディソン郡の住宅候補地をピンクの斜線で示し、学校、店、湿地を重ねた地図" href="../../images/projects/addison-housing.webp" rel="noopener noreferrer" target="_blank"><img alt="アディソン郡の住宅候補地をピンクの斜線で示し、学校、店、湿地を重ねた地図" height="2048" loading="lazy" src="../../images/projects/addison-housing.webp" width="1325"/></a>
<figcaption>住宅地の候補を示した地図</figcaption>
</figure></div>
<div class="project-writing"><p>既存の住宅地と、学校やスーパーまでの距離を使って候補地を地図にした。小・中・高校から0.5マイル、スーパーから5マイルの範囲を調べた。</p><p>湿地などの周辺環境も重ねた。この地図は候補を考えるための出発点で、建設すべき場所を決めるものではない。</p></div>
