<h1>点字ブロックの足りない場所</h1>
<p class="project-intro">ミドルベリー大学のキャンパスは、目が不自由な人にとっても歩きやすいのか。</p>
<div class="project-hero"><figure class="map-main">
<a aria-label="画像を大きく開く：ミドルベリー大学の点字ブロック調査。青は設置されている場所、赤は足りない場所" href="../../images/projects/tactile-map.webp" rel="noopener noreferrer" target="_blank"><img alt="ミドルベリー大学の点字ブロック調査。青は設置されている場所、赤は足りない場所" height="2048" loading="lazy" src="../../images/projects/tactile-map.webp" width="2048"/></a>
<figcaption>キャンパスの点字ブロック調査</figcaption>
</figure></div>
<div class="project-writing"><p>2025年9月、Mimi、Arloとキャンパスを歩き、横断歩道、歩道、交差点、階段、坂道の点字ブロックを調べた。結果をQGISで地図にした。</p><p>青は点字ブロックがある場所、赤はない場所。いくつもの横断歩道で注意を促すブロックが欠け、調べた階段と坂道には一つもなかった。</p></div>
