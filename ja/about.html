<h1>自己紹介</h1>
<p>Hinoto Tanaka。バーモント州のミドルベリー大学で地理学を学んでいる。日本にルーツがあり、デトロイト、名古屋、蘇州、香港、東京で暮らしてきた。今の家はインディアナ州フィッシャーズにある。地図づくりやGIS、空間の調査に取り組んでいて、地図の調査、デザイン、制作を通して、視覚的に物語を伝えることに興味がある。</p>
